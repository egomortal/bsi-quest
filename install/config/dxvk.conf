# BSI-Quest DXVK settings v3 (see https://github.com/doitsujin/dxvk/blob/master/dxvk.conf)
# shader compiler threads (they run at idle priority during play, so they mostly use spare time)
dxvk.numCompilerThreads = 3
# keep compiled pipeline libraries (True made DXVK recompile them on first use = hitches)
dxvk.trackPipelineLifetime = False
# fast-linked pipeline libraries only: no extra background optimised recompiles competing for the 3 cores
dxvk.enableGraphicsPipelineLibrary = True
# report 2 GB of video memory so the game keeps its texture pool modest (Quest: 5.75 GB per app, shared with the GPU)
dxgi.maxDeviceMemory = 2048
dxgi.maxFrameLatency=3
# low-latency frame pacing (less input lag)
dxvk.latencySleep=False
# even frame pacing on the 120 Hz display: every game frame is shown exactly twice (60) - try 40 if it dips a lot
dxgi.maxFrameRate = 60
dxgi.syncInterval = 0
dxvk.tearFree = False
